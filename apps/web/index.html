<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CS2 Skin Previewer — M8</title>
  </head>
  <body>
    <aside id="catalog-panel">
      <div class="catalog-head">
        <h1>AK-47 kits</h1>
        <p class="catalog-count" id="catalog-count">61 official</p>
        <input id="catalog-search" type="search" placeholder="Search en / 中文 / index…" autocomplete="off" />
      </div>
      <div id="catalog-list"></div>
    </aside>
    <div id="status">Loading AK-47 + catalog…</div>
    <div id="preview-badge" hidden>preview not implemented / 尚未做涂装</div>
    <div id="seed-panel">
      <label>
        <span>Kit</span>
        <select id="kit-select"></select>
      </label>
      <label>
        <span>Seed</span>
        <input id="seed-input" type="number" min="0" max="999" step="1" value="0" />
        <span id="seed-value">0</span>
      </label>
      <label>
        <span>Float</span>
        <input id="float-input" type="range" min="0" max="1" step="0.01" value="0" />
        <span id="float-value">0.00</span>
      </label>
      <div id="wear-range" class="hint">wear 0–1</div>
      <label class="unlock-row">
        <input id="unlock-wear" type="checkbox" />
        <span>Unlock 0–1</span>
      </label>
      <div class="btn-row" id="view-row">
        <span>View</span>
        <button type="button" data-view="inspect">Inspect</button>
        <button type="button" data-view="front">Front</button>
        <button type="button" data-view="back">Back</button>
      </div>
      <div class="btn-row" id="bg-row">
        <span>Background</span>
        <button type="button" data-bg="studio">Studio</button>
        <button type="button" data-bg="warm">Warm</button>
        <button type="button" data-bg="cool">Cool</button>
      </div>
      <a id="catalog-link" href="/catalog/ak47.html">All AK-47 kits</a>
      <div id="sticker-panel"></div>
    </div>
    <img id="m1-hold" src="/m8-hold.png" alt="" width="1" height="1" />
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
